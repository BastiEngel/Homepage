name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture Archive tile screenshot
        run: |
          npm run dev -- --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/archive > /dev/null && break
            sleep 1
          done
          node scripts/capture-archive-tile.mjs http://localhost:4173/archive static/images/projects/Archive/archive-live-tile.webp
          kill %1 2>/dev/null || true

      - name: Build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
