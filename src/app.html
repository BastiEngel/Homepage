<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/emojis/Engel_Bastian_Logo.svg" />
		<!-- Adobe Fonts (Typekit) and Google Fonts are loaded dynamically after
		     consent — see FontConsentBanner.svelte / fontConsent.ts — because
		     requesting them transmits the visitor's IP to a US server (GDPR). -->
		<!-- Preload primary self-hosted font — eliminates FOUT on first paint -->
		<link rel="preload" href="/fonts/sligoil-main/fonts/web/Sligoil-Micro.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
